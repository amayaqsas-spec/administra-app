<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Administra</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="assets/logo.png" type="image/png" />
</head>
<body>
    <div class="splash">
        <div class="clay box">
            <div class="logo-big">A</div>
            <h1>Administra</h1>
            <p>Gestión financiera y escolar</p>
            <div class="line"></div>
            <p style="color:#9ca3af;font-size:12px;">Cargando...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = 'index.html?view=login';
        }, 2500);

        // ============================================
        // REGISTRO DEL SERVICE WORKER
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('[Service Worker] Registrado correctamente');
                    })
                    .catch(function(error) {
                        console.log('[Service Worker] Error al registrar:', error);
                    });
            });
        }
    </script>
</body>
</html>
