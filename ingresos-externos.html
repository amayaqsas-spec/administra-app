    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 25%, #ede9fe 50%, #dbeafe 75%, #fce7f3 100%);
            background-attachment: fixed;
            display: flex;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 4px 0 32px rgba(0, 0, 0, 0.06);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; background: rgba(255,255,255,0.96); }
            .sidebar.open { transform: translateX(0); }
        }
        @media (min-width: 769px) { .sidebar { transform: translateX(0) !important; } }

            align-items: center;
            gap: 10px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.06);

        }
        .sidebar .logo-area .logo-icon {

            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.5);

        .sidebar .logo-area h1 { font-size: 16px; color: #1e1b4b; font-weight: 700; }
        .sidebar .logo-area .version {
            font-size: 9px;
            color: #7c3aed;
            font-weight: 600;
            background: rgba(124,58,237,0.1);
            padding: 1px 8px;

            margin-left: 2px;
        }
        .sidebar .btn-cerrar-menu {

            flex-direction: column;

        }

        .sidebar .menu .menu-item i { width: 20px; font-size: 16px; text-align: center; flex-shrink: 0; }
        .sidebar .menu .divider { height: 1px; background: rgba(0,0,0,0.06); margin: 8px 12px; }

            gap: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.4);
        }
        .sidebar .user-area .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #8b5cf6);

            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 14px;
        }

        .sidebar .user-area .user-info .user-email { font-size: 10px; color: #6b7280; }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);

        }

            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 10px 10px 28px rgba(0,0,0,0.05), -10px -10px 28px rgba(255,255,255,0.6),

            50% { opacity: 0.5; }
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;

        }
        .btn-nuevo {

            border-radius: 30px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 3px 12px rgba(16,185,129,0.3);

        .btn-nuevo i { font-size: 14px; }
        
        .btn-gasto {
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #dc2626, #b91c1c);

            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #dc2626, #b91c1c);

            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-pdf:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(220,38,38,0.4); }
        .btn-pdf i { font-size: 14px; }
        
        .ingreso-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.3);

        .ingreso-item .info { flex: 1; }
        .ingreso-item .info .descripcion { font-size: 14px; font-weight: 600; color: #1e1b4b; }
        .ingreso-item .info .detalle { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .ingreso-item .info .detalle span { margin-right: 12px; }
        .ingreso-item .monto {
            font-size: 16px;
            font-weight: 700;
            color: #059669;
            margin-right: 12px;
            white-space: nowrap;
        }
        .ingreso-item .acciones {
            display: flex;
            gap: 4px;
        }
        
        .gasto-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: inset 2px 2px 4px rgba(255,255,255,0.6), inset -2px -2px 4px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .gasto-item:hover { background: rgba(255,255,255,0.8); border-color: rgba(220,38,38,0.3); }
        .gasto-item .info { flex: 1; }
        .gasto-item .info .descripcion { font-size: 14px; font-weight: 600; color: #1e1b4b; }
        .gasto-item .info .detalle { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .gasto-item .info .detalle span { margin-right: 12px; }
        .gasto-item .monto {
            font-size: 16px;
            font-weight: 700;
            color: #dc2626;
            margin-right: 12px;
            white-space: nowrap;
        }
        .gasto-item .acciones {
            display: flex;
            gap: 4px;
        }
        
        .btn-sm {
            border: none;
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .btn-sm:hover { transform: scale(1.08); }
        .btn-sm i { font-size: 11px; }
        .btn-editar { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-eliminar { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        .seccion-titulo {
            font-size: 14px;
            font-weight: 700;
            color: #1e1b4b;
            margin: 18px 0 10px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid rgba(124,58,237,0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .seccion-titulo.ingresos { color: #059669; border-color: rgba(16,185,129,0.2); }
        .seccion-titulo.gastos { color: #dc2626; border-color: rgba(220,38,38,0.2); }
        
        .total-box {
            margin-top: 16px;
            padding: 16px 20px;
            border-radius: 18px;
            text-align: center;
        }
        .total-box.ingresos {
            background: rgba(16,185,129,0.12);
            border: 2px solid #10b981;
            box-shadow: 0 4px 16px rgba(16,185,129,0.15);
        }
        .total-box.gastos {
            background: rgba(220,38,38,0.12);
            border: 2px solid #dc2626;
            box-shadow: 0 4px 16px rgba(220,38,38,0.15);
        }
        .total-box.saldo {
            background: rgba(124,58,237,0.12);
            border: 2px solid #7c3aed;
            box-shadow: 0 4px 16px rgba(124,58,237,0.15);
        }
        .total-box .label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .total-box.ingresos .label { color: #065f46; }

        }

        .total-box.gastos .numero { color: #dc2626; }
        .total-box.saldo .numero { color: #7c3aed; }
        
        .btn-volver {
            border: none;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #6b7280, #4b5563);
            box-shadow: 0 2px 8px rgba(107,114,128,0.3);
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-volver:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(107,114,128,0.4); }
        .btn-volver i { font-size: 12px; }
        .footer {
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            margin-top: 20px;

        }
        .footer .brand { color: #a78bfa; font-weight: 600; font-size: 11px; }

            text-align: center;
            padding: 20px 16px;
            color: #6b7280;
            font-size: 13px;
        }
        .empty-message i { font-size: 32px; color: #c4b5fd; display: block; margin: 0 auto 10px; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
            animation: modalFadeIn 0.25s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 24px 20px 20px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 16px 48px rgba(0,0,0,0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #c4b5fd, #a78bfa); border-radius: 10px; }
        .modal-icono {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .modal-icono.ingreso-icono { background: linear-gradient(135deg, #10b981, #059669); }
        .modal-icono.gasto-icono { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .modal-icono i { font-size: 20px; color: white; }
        .modal-titulo { text-align: center; font-size: 20px; font-weight: 700; color: #1e1b4b; margin-bottom: 2px; }
        .modal-subtitulo { text-align: center; font-size: 12px; color: #6b7280; margin-bottom: 14px; }
        .modal-grupo { margin-bottom: 12px; }

            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            font-size: 14px;
            color: #1a1a2e;
            outline: none;
            box-shadow: inset 3px 3px 10px rgba(0,0,0,0.02), inset -3px -3px 10px rgba(255,255,255,0.4);

    <script>
        function abrirSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        function cerrarSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        document.addEventListener('click', function(e) {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && e.target !== overlay && !e.target.closest('.hamburger')) {
                    cerrarSidebar();
                }
            }
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                cerrarSidebar();
            }
        });

        function logout() {
            if (confirm('¿Cerrar sesión?')) {
                localStorage.removeItem('user_session');
                window.location.href = 'login.html';
            }
        }

        // ============================================
        // DATOS
        // ============================================
        function getIngresosExternos() {
            const data = localStorage.getItem('ingresosExternos');
            return data ? JSON.parse(data) : [];
        }

        function guardarIngresosExternos(ingresos) {
            localStorage.setItem('ingresosExternos', JSON.stringify(ingresos));
            localStorage.setItem('ingresosExternosActualizado', Date.now().toString());
        }

        function getGastosDirectos() {
            const data = localStorage.getItem('gastosDirectos');
            return data ? JSON.parse(data) : [];
        }

        function guardarGastosDirectos(gastos) {
            localStorage.setItem('gastosDirectos', JSON.stringify(gastos));
            localStorage.setItem('gastosDirectosActualizado', Date.now().toString());
        }

        var ingresos = getIngresosExternos();
        var gastos = getGastosDirectos();
        var nextIdIngreso = ingresos.length > 0 ? Math.max(...ingresos.map(function(i) { return i.id; })) + 1 : 1;
        var nextIdGasto = gastos.length > 0 ? Math.max(...gastos.map(function(g) { return g.id; })) + 1 : 1;

        // ============================================
        // RENDERIZAR
        // ============================================
        function renderizarTodo() {
            renderizarIngresos();
            renderizarGastos();
            actualizarTotales();
        }

        function renderizarIngresos() {
            var container = document.getElementById('ingresosList');

            if (ingresos.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-coins"></i>
                        No hay ingresos externos registrados
                    </div>
                `;
                return;
            }

            var sorted = [...ingresos].sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); });

            var html = '';
            sorted.forEach(function(ingreso) {
                html += `
                    <div class="ingreso-item" data-id="${ingreso.id}">
                        <div class="info">
                            <div class="descripcion">${ingreso.descripcion}</div>
                            <div class="detalle">
                                <span>📅 ${ingreso.fecha}</span>
                            </div>
                        </div>
                        <div class="monto">+$${ingreso.monto.toFixed(2)}</div>
                        <div class="acciones">
                            <button class="btn-sm btn-editar" onclick="mostrarModalEditarIngreso(${ingreso.id})">
                                <i class="fas fa-pencil-alt"></i>
                            </button>
                            <button class="btn-sm btn-eliminar" onclick="eliminarIngreso(${ingreso.id})">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderizarGastos() {
            var container = document.getElementById('gastosList');

            if (gastos.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-receipt"></i>
                        No hay gastos directos registrados
                    </div>
                `;
                return;
            }

            var sorted = [...gastos].sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); });

            var html = '';
            sorted.forEach(function(gasto) {
                html += `
                    <div class="gasto-item" data-id="${gasto.id}" onclick="verDetalleGasto(${gasto.id})">
                        <div class="info">
                            <div class="descripcion">${gasto.descripcion}</div>
                            <div class="detalle">
                                <span>📅 ${gasto.fecha}</span>
                            </div>
                        </div>
                        <div class="monto">-$${gasto.monto.toFixed(2)}</div>
                        <div class="acciones" onclick="event.stopPropagation();">
                            <button class="btn-sm btn-editar" onclick="mostrarModalEditarGasto(${gasto.id})">
                                <i class="fas fa-pencil-alt"></i>
                            </button>
                            <button class="btn-sm btn-eliminar" onclick="eliminarGasto(${gasto.id})">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function actualizarTotales() {
            var totalIngresos = ingresos.reduce(function(sum, i) { return sum + i.monto; }, 0);
            var totalGastos = gastos.reduce(function(sum, g) { return sum + g.monto; }, 0);
            var saldo = totalIngresos - totalGastos;

            document.getElementById('totalIngresos').textContent = '$' + totalIngresos.toFixed(2);
            document.getElementById('totalGastos').textContent = '$' + totalGastos.toFixed(2);
            document.getElementById('saldoDisponible').textContent = '$' + saldo.toFixed(2);
        }

        // ============================================
        // MODAL CREAR INGRESO
        // ============================================
        function mostrarModalCrearIngreso() {
            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono ingreso-icono">
                        <i class="fas fa-coins"></i>
                    </div>
                    <div class="modal-titulo">Nuevo Ingreso Externo</div>
                    <div class="modal-subtitulo">Registra un ingreso adicional</div>
                    <form id="formIngresoModal">
                        <div class="modal-grupo">
                            <label>Fecha <span class="obligatorio">*</span></label>
                            <input type="date" id="fechaIngresoInput" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Descripción <span class="obligatorio">*</span></label>
                            <input type="text" id="descripcionIngresoInput" placeholder="Ej: Venta de materiales" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Monto <span class="obligatorio">*</span></label>
                            <input type="number" id="montoIngresoInput" placeholder="Ej: 500.00" step="0.01" required>
                        </div>
                        <div class="modal-acciones">
                            <button type="submit" class="btn btn-guardar-ingreso">
                                <i class="fas fa-check"></i>
                                Guardar Ingreso
                            </button>
                            <button type="button" class="btn btn-cancelar" onclick="cerrarModal()">
                                <i class="fas fa-times"></i>
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);

            var fechaInput = document.getElementById('fechaIngresoInput');
            if (fechaInput) {
                fechaInput.value = new Date().toISOString().split('T')[0];
            }

            setTimeout(function() {
                var input = document.getElementById('descripcionIngresoInput');
                if (input) input.focus();
            }, 100);

            document.getElementById('formIngresoModal').addEventListener('submit', function(e) {
                e.preventDefault();

                var fecha = document.getElementById('fechaIngresoInput').value;
                var descripcion = document.getElementById('descripcionIngresoInput').value.trim();
                var monto = parseFloat(document.getElementById('montoIngresoInput').value);

                if (!fecha || !descripcion || !monto || monto <= 0) {
                    alert('⚠️ Completa todos los campos correctamente');
                    return;
                }

                ingresos.push({
                    id: nextIdIngreso++,
                    fecha: fecha,
                    descripcion: descripcion,
                    monto: monto
                });

                guardarIngresosExternos(ingresos);
                renderizarTodo();
                cerrarModal();
                alert('✅ Ingreso registrado correctamente');
            });
        }

        // ============================================
        // MODAL EDITAR INGRESO
        // ============================================
        function mostrarModalEditarIngreso(id) {
            var ingreso = ingresos.find(function(i) { return i.id === id; });
            if (!ingreso) return;

            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono" style="background:linear-gradient(135deg,#f59e0b,#d97706);">
                        <i class="fas fa-pencil-alt"></i>
                    </div>
                    <div class="modal-titulo">Editar Ingreso</div>
                    <div class="modal-subtitulo">Actualiza los datos</div>
                    <form id="formIngresoModal">
                        <div class="modal-grupo">
                            <label>Fecha <span class="obligatorio">*</span></label>
                            <input type="date" id="fechaIngresoInput" value="${ingreso.fecha}" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Descripción <span class="obligatorio">*</span></label>
                            <input type="text" id="descripcionIngresoInput" value="${ingreso.descripcion}" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Monto <span class="obligatorio">*</span></label>
                            <input type="number" id="montoIngresoInput" value="${ingreso.monto}" step="0.01" required>
                        </div>
                        <div class="modal-acciones">
                            <button type="submit" class="btn btn-editar-modal">
                                <i class="fas fa-check"></i>
                                Actualizar
                            </button>
                            <button type="button" class="btn btn-cancelar" onclick="cerrarModal()">
                                <i class="fas fa-times"></i>
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);

            setTimeout(function() {
                var input = document.getElementById('descripcionIngresoInput');
                if (input) input.focus();
            }, 100);

            document.getElementById('formIngresoModal').addEventListener('submit', function(e) {
                e.preventDefault();

                var fecha = document.getElementById('fechaIngresoInput').value;
                var descripcion = document.getElementById('descripcionIngresoInput').value.trim();
                var monto = parseFloat(document.getElementById('montoIngresoInput').value);

                if (!fecha || !descripcion || !monto || monto <= 0) {
                    alert('⚠️ Completa todos los campos correctamente');
                    return;
                }

                ingreso.fecha = fecha;
                ingreso.descripcion = descripcion;
                ingreso.monto = monto;

                guardarIngresosExternos(ingresos);
                renderizarTodo();
                cerrarModal();
                alert('✅ Ingreso actualizado correctamente');
            });
        }

        // ============================================
        // ELIMINAR INGRESO
        // ============================================
        function eliminarIngreso(id) {
            var ingreso = ingresos.find(function(i) { return i.id === id; });
            if (!ingreso) return;

            if (confirm('⚠️ ¿Eliminar el ingreso "' + ingreso.descripcion + '"?')) {
                ingresos = ingresos.filter(function(i) { return i.id !== id; });
                guardarIngresosExternos(ingresos);
                renderizarTodo();
                alert('✅ Ingreso eliminado');
            }
        }

        // ============================================
        // MODAL CREAR GASTO
        // ============================================
        function mostrarModalCrearGasto() {
            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono gasto-icono">
                        <i class="fas fa-minus-circle"></i>
                    </div>
                    <div class="modal-titulo">Nuevo Gasto Directo</div>

                            <button type="submit" class="btn btn-guardar-gasto">

                                Guardar Gasto

                            <button type="button" class="btn btn-cancelar" onclick="cerrarModal()">
                                <i class="fas fa-times"></i>

                        </div>
                    </form>
                </div>
            `;

                fechaInput.value = new Date().toISOString().split('T')[0];
            }

            setTimeout(function() {
                var input = document.getElementById('descripcionGastoInput');
                if (input) input.focus();
            }, 100);

            document.getElementById('formGastoModal').addEventListener('submit', function(e) {
                e.preventDefault();

                var fecha = document.getElementById('fechaGastoInput').value;
                var descripcion = document.getElementById('descripcionGastoInput').value.trim();
                var monto = parseFloat(document.getElementById('montoGastoInput').value);

                if (!fecha || !descripcion || !monto || monto <= 0) {
                    alert('⚠️ Completa todos los campos correctamente');
                    return;
                }

                gastos.push({
                    id: nextIdGasto++,
                    fecha: fecha,
                    descripcion: descripcion,
                    tipo: 'Directo',
                    monto: monto,
                    participantes: 1,
                    nota: '',
                    excluidos: []
                });

                guardarGastosDirectos(gastos);
                renderizarTodo();
                cerrarModal();
                alert('✅ Gasto directo registrado. Se descontará del Disponible Total.');
            });
        }

        // ============================================
        // MODAL EDITAR GASTO
        // ============================================

                if (input) input.focus();
            }, 100);

            document.getElementById('formGastoModal').addEventListener('submit', function(e) {
                e.preventDefault();

                var fecha = document.getElementById('fechaGastoInput').value;
                var descripcion = document.getElementById('descripcionGastoInput').value.trim();
                var monto = parseFloat(document.getElementById('montoGastoInput').value);

                if (!fecha || !descripcion || !monto || monto <= 0) {
                    alert('⚠️ Completa todos los campos correctamente');
                    return;
                }

                gasto.fecha = fecha;
                gasto.descripcion = descripcion;
                gasto.monto = monto;

                guardarGastosDirectos(gastos);
                renderizarTodo();
                cerrarModal();
                alert('✅ Gasto actualizado correctamente');
            });
        }

        // ============================================
        // ELIMINAR GASTO
        // ============================================
        function eliminarGasto(id) {
            var gasto = gastos.find(function(g) { return g.id === id; });
            if (!gasto) return;

            cerrarModalDetalle();

            if (confirm('⚠️ ¿Eliminar el gasto "' + gasto.descripcion + '" por $' + gasto.monto.toFixed(2) + '?')) {
                gastos = gastos.filter(function(g) { return g.id !== id; });
                guardarGastosDirectos(gastos);
                renderizarTodo();
                alert('✅ Gasto eliminado');
            }
        }

        // ============================================
        // VER DETALLE DEL GASTO
        // ============================================
        function verDetalleGasto(id) {
            var gasto = gastos.find(function(g) { return g.id === id; });
            if (!gasto) return;

            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay modal-detalle';
            overlay.id = 'modalDetalleOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono gasto-icono">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <div class="modal-titulo">${gasto.descripcion}</div>
                    <div class="modal-subtitulo">Detalle del gasto directo</div>

                    <div class="detalle-item">
                        <span class="etiqueta">📅 Fecha</span>
                        <span class="valor">${gasto.fecha}</span>
                    </div>
                    <div class="detalle-item">
                        <span class="etiqueta">💰 Monto</span>
                        <span class="valor rojo">-$${gasto.monto.toFixed(2)}</span>
                    </div>
                    <div class="detalle-item">
                        <span class="etiqueta">🏷️ Tipo</span>
                        <span class="valor">Gasto Directo</span>
                    </div>

                    <div class="detalle-acciones">
                        <button class="btn btn-editar-detalle" onclick="cerrarModalDetalle();mostrarModalEditarGasto(${gasto.id})">
                            <i class="fas fa-pencil-alt"></i>
                            Editar
                        </button>
                        <button class="btn btn-eliminar-detalle" onclick="cerrarModalDetalle();eliminarGasto(${gasto.id})">
                            <i class="fas fa-trash-alt"></i>
                            Eliminar
                        </button>
                        <button class="btn btn-cerrar-detalle" onclick="cerrarModalDetalle()">
                            <i class="fas fa-times"></i>
                            Cerrar
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function cerrarModalDetalle() {
            var modal = document.getElementById('modalDetalleOverlay');
            if (modal) modal.remove();
        }

        // ============================================
        // CERRAR MODAL
        // ============================================
        function cerrarModal() {
            var modal = document.getElementById('modalOverlay');
            if (modal) modal.remove();
        }

        document.addEventListener('click', function(e) {
            var modal = document.getElementById('modalOverlay');
            if (modal && e.target === modal) {
                cerrarModal();
            }
            var modalDetalle = document.getElementById('modalDetalleOverlay');
            if (modalDetalle && e.target === modalDetalle) {
                cerrarModalDetalle();
            }
        });

        // ============================================
        // MODAL PDF - GASTOS DIRECTOS
        // ============================================
        function mostrarModalPDF() {
            if (gastos.length === 0) {
                alert('⚠️ No hay gastos directos para imprimir');
                return;
            }

            var hoy = new Date();
            var primerDiaMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);

            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalPDFOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono" style="background:linear-gradient(135deg,#dc2626,#b91c1c);">
                        <i class="fas fa-file-pdf"></i>
                    </div>
                    <div class="modal-titulo">Imprimir Gastos Directos</div>
                    <div class="modal-subtitulo">Selecciona el rango de fechas</div>

                    <div class="modal-grupo">
                        <label>Fecha inicio <span class="obligatorio">*</span></label>
                        <input type="date" id="pdfFechaInicio" value="${primerDiaMes.toISOString().split('T')[0]}" required>
                    </div>
                    <div class="modal-grupo">
                        <label>Fecha fin <span class="obligatorio">*</span></label>
                        <input type="date" id="pdfFechaFin" value="${hoy.toISOString().split('T')[0]}" required>
                    </div>

                    <div class="modal-acciones">
                        <button type="button" class="btn btn-guardar-gasto" onclick="generarPDFGastosDirectos()">
                            <i class="fas fa-file-pdf"></i>
                            Generar PDF
                        </button>
                        <button type="button" class="btn btn-cancelar" onclick="cerrarModalPDF()">
                            <i class="fas fa-times"></i>
                            Cancelar
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function cerrarModalPDF() {
            var modal = document.getElementById('modalPDFOverlay');
            if (modal) modal.remove();
        }

        // ============================================
        // GENERAR PDF - GASTOS DIRECTOS
        // ============================================
        function generarPDFGastosDirectos() {
            var fechaInicio = document.getElementById('pdfFechaInicio').value;
            var fechaFin = document.getElementById('pdfFechaFin').value;

            if (!fechaInicio || !fechaFin) {
                alert('⚠️ Selecciona el rango de fechas');
                return;
            }

            cerrarModalPDF();

            var gastosFiltrados = gastos.filter(function(g) {
                return g.fecha >= fechaInicio && g.fecha <= fechaFin;
            });

            if (gastosFiltrados.length === 0) {
                alert('⚠️ No hay gastos en ese rango de fechas');
                return;
            }

            gastosFiltrados.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); });

            var fechaActual = new Date().toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
            var totalGastos = gastosFiltrados.reduce(function(sum, g) { return sum + (g.monto || 0); }, 0);

            // Crear PDF
            var { jsPDF } = window.jspdf;
            var doc = new jsPDF('p', 'mm', 'letter');
            var margin = 15;
            var pageWidth = doc.internal.pageSize.getWidth();

            // ===== ESCUDO =====
            var escudoWidth = 15;
            var escudoHeight = 15;
            var imgData = null;

            function dibujarEncabezado() {
                if (imgData) {
                    try {
                        doc.addImage(imgData, 'PNG', margin, margin, escudoWidth, escudoHeight);
                    } catch(e) {
                        doc.setFillColor(124, 58, 237);
                        doc.circle(margin + escudoWidth/2, margin + escudoHeight/2, escudoWidth/2, 'F');
                        doc.setTextColor(255, 255, 255);
                        doc.setFontSize(10);
                        doc.text('E', margin + escudoWidth/2, margin + escudoHeight/2 + 3.5, { align: 'center' });
                    }
                } else {
                    doc.setFillColor(124, 58, 237);
                    doc.circle(margin + escudoWidth/2, margin + escudoHeight/2, escudoWidth/2, 'F');
                    doc.setTextColor(255, 255, 255);
                    doc.setFontSize(10);
                    doc.text('E', margin + escudoWidth/2, margin + escudoHeight/2 + 3.5, { align: 'center' });
                }

                var tituloX = pageWidth / 2;
                var tituloY = margin + 3;
                doc.setFontSize(18);
                doc.setFont('helvetica', 'bold');
                doc.text('Gastos Directos', tituloX, tituloY, { align: 'center' });

                doc.setFontSize(11);
                doc.setFont('helvetica', 'normal');
                doc.text('Del ' + fechaInicio + ' al ' + fechaFin, tituloX, tituloY + 6, { align: 'center' });

                doc.setFontSize(9);
                doc.text('Fecha: ' + fechaActual, pageWidth - margin, tituloY, { align: 'right' });

                return tituloY + 12;
            }

            // Cargar escudo
            var loadImg = new Image();
            loadImg.crossOrigin = 'Anonymous';
            loadImg.src = 'assets/escuela.png';

            var pdfGenerado = false;

            loadImg.onload = function() {
                try {
                    var canvas = document.createElement('canvas');
                    canvas.width = loadImg.width;
                    canvas.height = loadImg.height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(loadImg, 0, 0);
                    imgData = canvas.toDataURL('image/png');
                } catch(e) {}
                if (!pdfGenerado) {
                    pdfGenerado = true;
                    generarPDFConImagen();
                }
            };

            loadImg.onerror = function() {
                if (!pdfGenerado) {
                    pdfGenerado = true;
                    generarPDFConImagen();
                }
            };

            setTimeout(function() {
                if (!pdfGenerado) {
                    pdfGenerado = true;
                    generarPDFConImagen();
                }
            }, 500);

            function generarPDFConImagen() {
                var yStart = dibujarEncabezado();

                var headRow = ['Fecha', 'Descripción', 'Monto'];
                var columnStyles = {
                    0: { halign: 'center', cellWidth: 25 },
                    1: { cellWidth: 'auto' },
                    2: { halign: 'right', cellWidth: 25 }
                };

                var bodyRows = [];
                gastosFiltrados.forEach(function(gasto) {
                    bodyRows.push([
                        gasto.fecha,
                        gasto.descripcion,
                        '$' + gasto.monto.toFixed(2)
                    ]);
                });

                doc.autoTable({
                    head: [headRow],
                    body: bodyRows,
                    startY: yStart,
                    margin: { left: margin, right: margin },
                    tableWidth: 'auto',
                    styles: {
                        fontSize: 8,
                        cellPadding: 1.5,
                        valign: 'middle',
                        fillColor: [255, 255, 255],
                        textColor: [0, 0, 0],
                        lineColor: [0, 0, 0],
                        lineWidth: 0.2
                    },
                    headStyles: {
                        fillColor: [255, 255, 255],
                        textColor: [0, 0, 0],
                        fontStyle: 'bold',
                        fontSize: 7,
                        halign: 'left',
                        lineColor: [0, 0, 0],
                        lineWidth: 0.3
                    },
                    columnStyles: columnStyles
                });

                var finalY = doc.internal.pageSize.getHeight() - 20;

                doc.setLineWidth(0.3);
                doc.line(margin, finalY - 2, pageWidth - margin, finalY - 2);

                doc.setFontSize(11);
                doc.setFont('helvetica', 'bold');
                doc.text('Total Gastos Directos: $' + totalGastos.toFixed(2), margin, finalY + 4);

                var footerY = doc.internal.pageSize.getHeight() - 10;
                doc.setFontSize(8);
                doc.setFont('helvetica', 'normal');
                doc.text(gastosFiltrados.length + ' registros', margin, footerY);
                doc.text('Total: $' + totalGastos.toFixed(2), pageWidth - margin, footerY, { align: 'right' });

                doc.save('Gastos_Directos_' + fechaInicio + '_al_' + fechaFin + '.pdf');
            }
        }

        // ============================================
        // INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            renderizarTodo();
        });

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            renderizarTodo();
        }

        // Exponer funciones
        window.abrirSidebar = abrirSidebar;
        window.cerrarSidebar = cerrarSidebar;
        window.logout = logout;
        window.mostrarModalCrearIngreso = mostrarModalCrearIngreso;
        window.mostrarModalEditarIngreso = mostrarModalEditarIngreso;
        window.eliminarIngreso = eliminarIngreso;
        window.mostrarModalCrearGasto = mostrarModalCrearGasto;
        window.mostrarModalEditarGasto = mostrarModalEditarGasto;
        window.eliminarGasto = eliminarGasto;
        window.verDetalleGasto = verDetalleGasto;
        window.cerrarModal = cerrarModal;
        window.cerrarModalDetalle = cerrarModalDetalle;
        window.mostrarModalPDF = mostrarModalPDF;
        window.cerrarModalPDF = cerrarModalPDF;
        window.generarPDFGastosDirectos = generarPDFGastosDirectos;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('[Service Worker] Registrado correctamente');
                    })
                    .catch(function(error) {
                        console.log('[Service Worker] Error al registrar:', error);
                    });
            });
        }
    </script>
</body>
</html>
