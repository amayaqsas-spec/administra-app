<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administra - Grupos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 25%, #ede9fe 50%, #dbeafe 75%, #fce7f3 100%);
            background-attachment: fixed;
            display: flex;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 4px 0 32px rgba(0, 0, 0, 0.06);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
                background: rgba(255, 255, 255, 0.96);
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }

        @media (min-width: 769px) {
            .sidebar {
                transform: translateX(0) !important;
            }
        }

        .sidebar .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .sidebar .logo-area .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            flex-shrink: 0;
        }

        .sidebar .logo-area h1 {
            font-size: 16px;
            color: #1e1b4b;
            font-weight: 700;
        }

        .sidebar .logo-area .version {
            font-size: 9px;
            color: #7c3aed;
            font-weight: 600;
            background: rgba(124, 58, 237, 0.1);
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .sidebar .btn-cerrar-menu {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: #6b7280;
            cursor: pointer;
            padding: 4px;
            margin-left: auto;
            transition: all 0.2s;
        }
        .sidebar .btn-cerrar-menu:hover {
            color: #1e1b4b;
        }
        @media (max-width: 768px) {
            .sidebar .btn-cerrar-menu {
                display: block;
            }
        }

        .sidebar .menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar .menu .menu-label {
            font-size: 9px;
            text-transform: uppercase;
            color: #9ca3af;
            font-weight: 700;
            letter-spacing: 0.8px;
            padding: 8px 12px 4px 12px;
        }

        .sidebar .menu .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            color: #4a4a6a;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .sidebar .menu .menu-item:hover {
            background: rgba(124, 58, 237, 0.08);
            color: #5b21b6;
        }

        .sidebar .menu .menu-item.active {
            background: rgba(124, 58, 237, 0.12);
            color: #5b21b6;
            font-weight: 600;
        }

        .sidebar .menu .menu-item i {
            width: 20px;
            font-size: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar .menu .divider {
            height: 1px;
            background: rgba(0, 0, 0, 0.06);
            margin: 8px 12px;
        }

        .sidebar .user-area {
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            margin-top: 4px;
        }

        .sidebar .user-area .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.4);
        }

        .sidebar .user-area .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }

        .sidebar .user-area .user-info .user-name {
            font-size: 12px;
            font-weight: 600;
            color: #1e1b4b;
        }

        .sidebar .user-area .user-info .user-email {
            font-size: 10px;
            color: #6b7280;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }
        @media (min-width: 769px) {
            .sidebar-overlay {
                display: none !important;
            }
        }

        .main-content {
            margin-left: 0;
            padding: 16px;
            flex: 1;
            min-height: 100vh;
            width: 100%;
            transition: margin-left 0.3s ease;
        }

        @media (min-width: 769px) {
            .main-content {
                margin-left: 240px;
                padding: 24px;
                width: calc(100% - 240px);
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .clay {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 10px 10px 28px rgba(0, 0, 0, 0.05), -10px -10px 28px rgba(255, 255, 255, 0.6),
                        inset 2px 2px 4px rgba(255, 255, 255, 0.8), inset -2px -2px 4px rgba(0, 0, 0, 0.02);
        }

        .clay-sm { padding: 10px 12px; border-radius: 16px; }
        .clay-md { padding: 14px 16px; border-radius: 20px; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .dashboard-header .titulo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dashboard-header .titulo h2 {
            font-size: 20px;
            color: #1e1b4b;
            font-weight: 700;
        }

        .dashboard-header .titulo p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .hamburger {
            display: block;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 20px;
            color: #1e1b4b;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .hamburger:hover {
            background: rgba(255, 255, 255, 0.8);
        }
        @media (min-width: 769px) {
            .hamburger {
                display: none !important;
            }
        }

        .dashboard-header .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #6b7280;
            background: rgba(255, 255, 255, 0.5);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .connection .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .connection .dot.green {
            background: #34d399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .top-bar h2 {
            font-size: 16px;
            color: #1e1b4b;
            font-weight: 700;
        }

        .btn-nuevo {
            border: none;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            box-shadow: 0 3px 10px rgba(124, 58, 237, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nuevo:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
        }

        .btn-nuevo i { font-size: 12px; }

        .grupo-item {
            padding: 14px 16px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.6), inset -2px -2px 4px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .grupo-item:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: scale(1.01);
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .grupo-item:active { transform: scale(0.98); }
        .grupo-item:last-child { margin-bottom: 0; }

        .grupo-item .header-grupo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .grupo-item .header-grupo .info h3 {
            font-size: 15px;
            color: #1e1b4b;
            font-weight: 700;
        }

        .grupo-item .header-grupo .info p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .grupo-item .header-grupo .info .alumnos-count {
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
        }

        .grupo-item .header-grupo .acciones {
            display: flex;
            gap: 4px;
        }

        .grupo-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .grupo-stats .stat-item {
            text-align: center;
            padding: 6px 4px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.3);
        }

        .grupo-stats .stat-item .numero {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
        }

        .grupo-stats .stat-item .etiqueta {
            font-size: 9px;
            color: #6b7280;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .grupo-stats .stat-item .recaudado-color { color: #059669; }
        .grupo-stats .stat-item .disponible-color { color: #7c3aed; }
        .grupo-stats .stat-item .gastos-color { color: #dc2626; }

        .btn-sm {
            border: none;
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-sm i { font-size: 11px; }
        .btn-sm:hover { transform: scale(1.08); }

        .btn-editar { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-eliminar { background: linear-gradient(135deg, #ef4444, #dc2626); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
            animation: modalFadeIn 0.25s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 24px 20px 20px;
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.1);
        }

        .modal-icono {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.2);
        }

        .modal-icono i { font-size: 20px; color: white; }

        .modal-titulo {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 2px;
        }

        .modal-subtitulo {
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .modal-grupo {
            margin-bottom: 12px;
        }

        .modal-grupo label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #4a4a6a;
            margin-bottom: 3px;
        }

        .modal-grupo label .obligatorio { color: #ef4444; }

        .modal-grupo input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            font-size: 14px;
            color: #1a1a2e;
            outline: none;
            box-shadow: inset 3px 3px 10px rgba(0, 0, 0, 0.02), inset -3px -3px 10px rgba(255, 255, 255, 0.4);
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .modal-grupo input:focus {
            border-color: #a78bfa;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1), inset 3px 3px 10px rgba(0, 0, 0, 0.02);
        }

        .modal-grupo input::placeholder {
            color: #a0a0b8;
            font-size: 13px;
        }

        .modal-acciones {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-acciones .btn {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .modal-acciones .btn i { font-size: 14px; }

        .modal-acciones .btn-guardar {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            box-shadow: 0 3px 12px rgba(124, 58, 237, 0.2);
        }

        .modal-acciones .btn-guardar:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
        }

        .modal-acciones .btn-cancelar {
            background: rgba(255, 255, 255, 0.7);
            color: #4a4a6a;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .modal-acciones .btn-cancelar:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.02);
        }

        .modal-acciones .btn-editar-modal {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 3px 12px rgba(245, 158, 11, 0.2);
        }

        .modal-acciones .btn-editar-modal:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
        }

        .empty-message {
            text-align: center;
            padding: 30px 16px;
            color: #6b7280;
            font-size: 13px;
        }

        .empty-message i {
            font-size: 32px;
            color: #c4b5fd;
            display: block;
            margin: 0 auto 10px;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            margin-top: 20px;
            padding: 8px 0;
        }

        .footer .brand { color: #a78bfa; font-weight: 600; font-size: 11px; }

        @media (max-width: 380px) {
            .main-content { padding: 10px; }
            .top-bar h2 { font-size: 14px; }
            .btn-nuevo { font-size: 11px; padding: 5px 12px; }
            .grupo-item { padding: 10px 12px; }
            .grupo-item .header-grupo .info h3 { font-size: 14px; }
            .grupo-stats .stat-item .numero { font-size: 13px; }
            .modal-content { padding: 18px 14px 14px; }
            .modal-titulo { font-size: 18px; }
            .modal-acciones .btn { font-size: 13px; padding: 8px 10px; }
        }

        @media (min-width: 600px) {
            .main-content { padding: 24px; }
            .container { max-width: 600px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="cerrarSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo-icon">A</div>
            <div>
                <h1>Administra <span class="version">v2.0</span></h1>
            </div>
            <button class="btn-cerrar-menu" onclick="cerrarSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="menu">
            <div class="menu-label">Menú principal</div>

            <button class="menu-item" onclick="cerrarSidebar(); location.href='dashboard.html'">
                <i class="fas fa-th-large"></i>
                Dashboard
            </button>

            <button class="menu-item active" onclick="cerrarSidebar(); location.href='grupos.html'">
                <i class="fas fa-users"></i>
                Grupos
            </button>

            <button class="menu-item" onclick="cerrarSidebar(); location.href='alumnos.html'">
                <i class="fas fa-user-graduate"></i>
                Alumnos
            </button>

            <button class="menu-item" onclick="cerrarSidebar(); location.href='gastos.html'">
                <i class="fas fa-credit-card"></i>
                Gastos
            </button>

            <button class="menu-item" onclick="cerrarSidebar(); location.href='reportes.html'">
                <i class="fas fa-file-alt"></i>
                Reportes
            </button>

            <button class="menu-item" onclick="cerrarSidebar(); location.href='extra-notas.html'">
                <i class="fas fa-sticky-note"></i>
                Extra Notas
            </button>

            <div class="divider"></div>

            <div class="menu-label">Sistema</div>

            <button class="menu-item" onclick="cerrarSidebar(); location.href='configuracion.html'">
                <i class="fas fa-cog"></i>
                Configuración
            </button>

            <button class="menu-item" onclick="cerrarSidebar(); location.href='acerca.html'">
                <i class="fas fa-info-circle"></i>
                Acerca de
            </button>
        </div>

        <div class="user-area">
            <div class="user-info">
                <div class="avatar">A</div>
                <div>
                    <div class="user-name">Administrador</div>
                    <div class="user-email">Modo Local</div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="dashboard-header">
                <div class="titulo">
                    <button class="hamburger" onclick="abrirSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h2>📚 Grupos</h2>
                        <p>Gestión de grupos escolares</p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="connection">
                        <span class="dot green"></span>
                        <span>Local</span>
                    </div>
                </div>
            </div>

            <div class="clay clay-md">
                <div class="top-bar">
                    <h2>Grupos</h2>
                    <button class="btn-nuevo" onclick="mostrarModalCrear()">
                        <i class="fas fa-plus"></i>
                        Nuevo
                    </button>
                </div>

                <div id="gruposList"></div>
            </div>

            <div class="footer">
                <span class="brand">amayasily</span>
                <span style="color:#d1d5db;margin:0 4px;">·</span>
                <span style="color:#9ca3af;">Administra v2.0</span>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        function abrirSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        function cerrarSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        document.addEventListener('click', function(e) {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && e.target !== overlay && !e.target.closest('.hamburger')) {
                    cerrarSidebar();
                }
            }
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                cerrarSidebar();
            }
        });

        function logout() {
            if (confirm('¿Cerrar sesión?')) {
                localStorage.removeItem('user_session');
                window.location.href = 'login.html';
            }
        }

        function renderizarGrupos() {
            var container = document.getElementById('gruposList');
            var grupos = getGrupos();
            var alumnos = getAlumnos();
            var gastos = getGastos();

            if (grupos.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-users"></i>
                        No hay grupos creados
                        <br><br>
                        <button class="btn-nuevo" onclick="mostrarModalCrear()" style="margin:0 auto;">
                            <i class="fas fa-plus"></i>
                            Crear grupo
                        </button>
                    </div>
                `;
                return;
            }

            var html = '';
            grupos.forEach(function(grupo) {
                var alumnosGrupo = alumnos.filter(function(a) { return a.grupoId === grupo.id; });
                var totalAlumnos = alumnosGrupo.length;
                var recaudado = alumnosGrupo.reduce(function(sum, a) { return sum + (a.pagado || 0); }, 0);
                var disponible = alumnosGrupo.reduce(function(sum, a) { return sum + (a.disponible || 0); }, 0);
                var gastosGrupo = gastos.filter(function(g) { return g.grupoId === grupo.id; });
                var totalGastos = gastosGrupo.reduce(function(sum, g) { return sum + (g.monto || 0); }, 0);

                html += `
                    <div class="grupo-item" onclick="seleccionarGrupo(${grupo.id})">
                        <div class="header-grupo">
                            <div class="info">
                                <h3>${grupo.nombre}</h3>
                                <p>👨‍🏫 ${grupo.profesor}</p>
                                <div class="alumnos-count">👨‍🎓 ${totalAlumnos} alumnos</div>
                            </div>
                            <div class="acciones">
                                <button class="btn-sm btn-editar" onclick="event.stopPropagation();mostrarModalEditar(${grupo.id})">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                                <button class="btn-sm btn-eliminar" onclick="event.stopPropagation();eliminarGrupo(${grupo.id})">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>

                        <div class="grupo-stats">
                            <div class="stat-item">
                                <div class="numero recaudado-color">$${recaudado.toLocaleString()}</div>
                                <div class="etiqueta">Recaudado</div>
                            </div>
                            <div class="stat-item">
                                <div class="numero disponible-color">$${disponible.toLocaleString()}</div>
                                <div class="etiqueta">Disponible</div>
                            </div>
                            <div class="stat-item">
                                <div class="numero gastos-color">$${totalGastos.toLocaleString()}</div>
                                <div class="etiqueta">Gastos</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function seleccionarGrupo(id) {
            window.location.href = 'alumnos.html?grupo=' + id;
        }

        function mostrarModalCrear() {
            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="modal-titulo">Nuevo Grupo</div>
                    <div class="modal-subtitulo">Ingresa los datos del grupo</div>
                    <form id="formGrupoModal">
                        <div class="modal-grupo">
                            <label>Nombre del grupo <span class="obligatorio">*</span></label>
                            <input type="text" id="nombreGrupoInput" placeholder="Ej: Grupo 1A" required autofocus>
                        </div>
                        <div class="modal-grupo">
                            <label>Maestro asignado</label>
                            <input type="text" id="profesorGrupoInput" placeholder="Ej: Prof. Martínez">
                        </div>
                        <div class="modal-acciones">
                            <button type="submit" class="btn btn-guardar">
                                <i class="fas fa-check"></i>
                                Crear Grupo
                            </button>
                            <button type="button" class="btn btn-cancelar" onclick="cerrarModal()">
                                <i class="fas fa-times"></i>
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);

            setTimeout(function() {
                var input = document.getElementById('nombreGrupoInput');
                if (input) input.focus();
            }, 100);

            document.getElementById('formGrupoModal').addEventListener('submit', function(e) {
                e.preventDefault();
                var nombre = document.getElementById('nombreGrupoInput').value.trim();
                var profesor = document.getElementById('profesorGrupoInput').value.trim() || 'Sin maestro asignado';

                if (!nombre) {
                    alert('⚠️ El nombre del grupo es obligatorio');
                    return;
                }

                var result = crearGrupo(nombre, profesor);
                if (result.success) {
                    renderizarGrupos();
                    cerrarModal();
                    alert('✅ Grupo "' + nombre + '" creado');
                } else {
                    alert('❌ Error al crear grupo: ' + result.error);
                }
            });
        }

        function mostrarModalEditar(id) {
            var grupos = getGrupos();
            var grupo = grupos.find(function(g) { return g.id === id; });
            if (!grupo) return;

            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono" style="background:linear-gradient(135deg,#f59e0b,#d97706);">
                        <i class="fas fa-pencil-alt"></i>
                    </div>
                    <div class="modal-titulo">Editar Grupo</div>
                    <div class="modal-subtitulo">Actualiza los datos</div>
                    <form id="formGrupoModal">
                        <div class="modal-grupo">
                            <label>Nombre del grupo <span class="obligatorio">*</span></label>
                            <input type="text" id="nombreGrupoInput" value="${grupo.nombre}" required autofocus>
                        </div>
                        <div class="modal-grupo">
                            <label>Maestro asignado</label>
                            <input type="text" id="profesorGrupoInput" value="${grupo.profesor}">
                        </div>
                        <div class="modal-acciones">
                            <button type="submit" class="btn btn-editar-modal">
                                <i class="fas fa-check"></i>
                                Actualizar
                            </button>
                            <button type="button" class="btn btn-cancelar" onclick="cerrarModal()">
                                <i class="fas fa-times"></i>
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);

            setTimeout(function() {
                var input = document.getElementById('nombreGrupoInput');
                if (input) input.focus();
            }, 100);

            document.getElementById('formGrupoModal').addEventListener('submit', function(e) {
                e.preventDefault();
                var nombre = document.getElementById('nombreGrupoInput').value.trim();
                var profesor = document.getElementById('profesorGrupoInput').value.trim() || 'Sin maestro asignado';

                if (!nombre) {
                    alert('⚠️ El nombre del grupo es obligatorio');
                    return;
                }

                var result = actualizarGrupo(id, nombre, profesor);
                if (result.success) {
                    renderizarGrupos();
                    cerrarModal();
                    alert('✅ Grupo "' + nombre + '" actualizado');
                } else {
                    alert('❌ Error al actualizar grupo: ' + result.error);
                }
            });
        }

        function eliminarGrupo(id) {
            var grupos = getGrupos();
            var grupo = grupos.find(function(g) { return g.id === id; });
            if (!grupo) return;

            if (confirm('⚠️ ¿Eliminar "' + grupo.nombre + '"? Se eliminarán todos los alumnos.')) {
                var result = eliminarGrupo(id);
                if (result.success) {
                    renderizarGrupos();
                    alert('✅ Grupo eliminado');
                } else {
                    alert('❌ Error al eliminar grupo: ' + result.error);
                }
            }
        }

        function cerrarModal() {
            var modal = document.getElementById('modalOverlay');
            if (modal) modal.remove();
        }

        document.addEventListener('click', function(e) {
            var modal = document.getElementById('modalOverlay');
            if (modal && e.target === modal) {
                cerrarModal();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            renderizarGrupos();
        });

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            renderizarGrupos();
        }

        window.abrirSidebar = abrirSidebar;
        window.cerrarSidebar = cerrarSidebar;
        window.logout = logout;
        window.mostrarModalCrear = mostrarModalCrear;
        window.mostrarModalEditar = mostrarModalEditar;
        window.eliminarGrupo = eliminarGrupo;
        window.cerrarModal = cerrarModal;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('[Service Worker] Registrado correctamente');
                    })
                    .catch(function(error) {
                        console.log('[Service Worker] Error al registrar:', error);
                    });
            });
        }
    </script>
</body>
</html>
