<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administra - Iniciar Sesión</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 25%, #ede9fe 50%, #dbeafe 75%, #fce7f3 100%);
            background-attachment: fixed;
        }

        .clay {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 28px 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 12px 12px 32px rgba(0, 0, 0, 0.06), -12px -12px 32px rgba(255, 255, 255, 0.7),
                        inset 2px 2px 4px rgba(255, 255, 255, 0.8), inset -2px -2px 4px rgba(0, 0, 0, 0.02);
            max-width: 380px;
            width: 100%;
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: white;
            font-size: 26px;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 2px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #4a4a6a;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            font-size: 14px;
            color: #1a1a2e;
            outline: none;
            box-shadow: inset 4px 4px 12px rgba(0, 0, 0, 0.03), inset -4px -4px 12px rgba(255, 255, 255, 0.5);
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #a78bfa;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.12), inset 4px 4px 12px rgba(0, 0, 0, 0.03);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.35);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.45);
        }

        .btn-login:active { transform: scale(0.97); }

        .error-msg {
            background: rgba(254, 202, 202, 0.2);
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
            backdrop-filter: blur(4px);
        }

        .error-msg.show { display: block; }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            margin-top: 14px;
        }

        .credential-hint {
            text-align: center;
            font-size: 11px;
            color: #d1d5db;
            margin-top: 4px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .brand {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #a78bfa;
            font-weight: 600;
        }

        @media (max-width: 380px) {
            .clay { padding: 20px 16px; border-radius: 22px; }
            h1 { font-size: 20px; }
            .logo { width: 52px; height: 52px; font-size: 22px; }
            .btn-login { font-size: 14px; padding: 10px; }
        }

        @media (min-width: 600px) {
            .clay { max-width: 420px; padding: 36px 32px; }
            h1 { font-size: 28px; }
            .logo { width: 72px; height: 72px; font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="clay">
        <div class="logo">A</div>
        <h1>Administra</h1>
        <p class="subtitle">Control escolar y financiero</p>

        <div id="errorMsg" class="error-msg">❌ Usuario o contraseña incorrectos</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" value="admin@escuela.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" value="Admin123456" required>
            </div>
            <button type="submit" class="btn-login">
                <i data-lucide="log-in"></i>
                Entrar
            </button>
        </form>

        <p class="footer-text">Versión 2.0.0</p>
        <div class="credential-hint">👤 admin@escuela.com / 🔑 Admin123456</div>
        <div class="brand">amayasily</div>
    </div>

    <script>
        // ============================================
        // ⚠️ IMPORTANTE: Reemplaza con tus claves de Supabase
        // ============================================
        const SUPABASE_URL = 'https://ncbbudvyi9pkmnmyto1.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jYmJ1ZHZ5aTlwa21ubXl0bzEiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczNjI5MTIzNCwiZXhwIjoyMDUxODY3MjM0fQ.6Lg9sKzXqQf2oQ8fL9e8QfF7sQ0QfL9e8QfF7sQ0Q';

        // Inicializar Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // FUNCIÓN DE LOGIN
        // ============================================
        async function loginUser(email, password) {
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                if (error) throw error;
                return { success: true, data: data };
            } catch (error) {
                console.error('Error en login:', error);
                return { success: false, error: error.message };
            }
        }

        // ============================================
        // EVENTO DEL FORMULARIO
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();

            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorMsg = document.getElementById('errorMsg');

                console.log('Intentando login con:', email);

                const result = await loginUser(email, password);

                if (result.success) {
                    localStorage.setItem('user_session', JSON.stringify({
                        email: email,
                        timestamp: new Date().toISOString()
                    }));
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = '❌ ' + result.error;
                    errorMsg.className = 'error-msg show';
                    console.error('Error de login:', result.error);
                    setTimeout(() => { errorMsg.className = 'error-msg'; }, 3000);
                }
            });
        });

        // ============================================
        // REGISTRO DEL SERVICE WORKER
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('[Service Worker] Registrado correctamente');
                    })
                    .catch(function(error) {
                        console.log('[Service Worker] Error al registrar:', error);
                    });
            });
        }
    </script>
</body>
</html>
