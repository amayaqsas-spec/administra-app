<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administra - Sin conexión</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 25%, #ede9fe 50%, #dbeafe 75%, #fce7f3 100%);
            background-attachment: fixed;
            padding: 20px;
        }

        .offline-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 12px 12px 32px rgba(0, 0, 0, 0.06), -12px -12px 32px rgba(255, 255, 255, 0.7),
                        inset 2px 2px 4px rgba(255, 255, 255, 0.8), inset -2px -2px 4px rgba(0, 0, 0, 0.02);
            max-width: 360px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .offline-box .icon {
            font-size: 56px;
            margin-bottom: 12px;
            display: block;
        }

        .offline-box .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: white;
            font-size: 34px;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        .offline-box h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1e1b4b;
        }

        .offline-box p {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
            line-height: 1.5;
        }

        .offline-box .sub {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 8px;
        }

        .offline-box .brand {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            font-size: 12px;
            color: #a78bfa;
            font-weight: 600;
        }

        .offline-box .btn-retry {
            margin-top: 16px;
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .offline-box .btn-retry:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.45);
        }

        .offline-box .btn-retry:active {
            transform: scale(0.97);
        }

        .offline-box .btn-retry i {
            font-size: 16px;
        }

        .offline-box .btn-offline {
            margin-top: 10px;
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #4a4a6a;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .offline-box .btn-offline:hover {
            background: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="offline-box">
        <div class="logo">A</div>
        <h1>Sin conexión</h1>
        <p>No se puede establecer conexión con el servidor.</p>
        <p class="sub">Los datos guardados localmente están disponibles</p>

        <button class="btn-retry" onclick="retryConnection()">
            <i class="fas fa-sync-alt"></i>
            Reintentar
        </button>

        <br>
        <button class="btn-offline" onclick="goOffline()">
            <i class="fas fa-arrow-right"></i>
            Continuar sin internet
        </button>

        <div class="brand">amayasily</div>
    </div>

    <!-- Font Awesome para los iconos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>

    <script>
        // ============================================
        // FUNCIÓN PARA REINTENTAR CONEXIÓN
        // ============================================
        function retryConnection() {
            var btn = document.querySelector('.btn-retry');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Conectando...';
            btn.disabled = true;

            // Verificar conexión
            if (navigator.onLine) {
                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 500);
            } else {
                setTimeout(function() {
                    btn.innerHTML = '<i class="fas fa-sync-alt"></i> Reintentar';
                    btn.disabled = false;
                    alert('⚠️ No hay conexión a internet. Intenta de nuevo más tarde.');
                }, 1000);
            }
        }

        // ============================================
        // FUNCIÓN PARA IR AL MODO OFFLINE
        // ============================================
        function goOffline() {
            // Verificar si hay datos guardados
            var tieneDatos = localStorage.getItem('grupos') !== null ||
                            localStorage.getItem('alumnos') !== null ||
                            localStorage.getItem('gastos') !== null;

            if (tieneDatos) {
                window.location.href = 'dashboard.html';
            } else {
                alert('⚠️ No hay datos guardados localmente. Conéctate a internet para cargar la app.');
            }
        }

        // ============================================
        // DETECTAR CUANDO VUELVE LA CONEXIÓN
        // ============================================
        window.addEventListener('online', function() {
            var btn = document.querySelector('.btn-retry');
            btn.innerHTML = '<i class="fas fa-wifi"></i> ¡Conectado! Ir a la app';
            btn.disabled = false;
            btn.onclick = function() {
                window.location.href = 'dashboard.html';
            };
        });

        // ============================================
        // REGISTRO DEL SERVICE WORKER
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('[Service Worker] Registrado correctamente');
                    })
                    .catch(function(error) {
                        console.log('[Service Worker] Error al registrar:', error);
                    });
            });
        }

        console.log('[Offline] Página de sin conexión cargada');
    </script>
</body>
</html>
