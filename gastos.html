<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administra - Gastos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 25%, #ede9fe 50%, #dbeafe 75%, #fce7f3 100%);
            background-attachment: fixed;
            display: flex;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 240px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 4px 0 32px rgba(0, 0, 0, 0.06);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            overflow-y: auto;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; background: rgba(255,255,255,0.96); }
            .sidebar.open { transform: translateX(0); }
        }
        @media (min-width: 769px) { .sidebar { transform: translateX(0) !important; } }
        .sidebar .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .sidebar .logo-area .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.5);
            flex-shrink: 0;
        }
        .sidebar .logo-area h1 { font-size: 16px; color: #1e1b4b; font-weight: 700; }
        .sidebar .logo-area .version {
            font-size: 9px;
            color: #7c3aed;
            font-weight: 600;
            background: rgba(124,58,237,0.1);
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 2px;
        }
        .sidebar .btn-cerrar-menu {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: #6b7280;
            cursor: pointer;
            padding: 4px;
            margin-left: auto;
            transition: all 0.2s;

        .sidebar .btn-cerrar-menu:hover { color: #1e1b4b; }
        @media (max-width: 768px) { .sidebar .btn-cerrar-menu { display: block; } }
        .sidebar .menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar .menu .menu-label {
            font-size: 9px;
            text-transform: uppercase;
            color: #9ca3af;
            font-weight: 700;
            letter-spacing: 0.8px;
            padding: 8px 12px 4px 12px;
        }
        .sidebar .menu .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            color: #4a4a6a;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .sidebar .menu .menu-item:hover { background: rgba(124,58,237,0.08); color: #5b21b6; }
        .sidebar .menu .menu-item.active { background: rgba(124,58,237,0.12); color: #5b21b6; font-weight: 600; }
        .sidebar .menu .menu-item i { width: 20px; font-size: 16px; text-align: center; flex-shrink: 0; }
        .sidebar .menu .divider { height: 1px; background: rgba(0,0,0,0.06); margin: 8px 12px; }
        .sidebar .user-area {
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.06);
            margin-top: 4px;
        }
        .sidebar .user-area .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.4);
        }
        .sidebar .user-area .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }
        .sidebar .user-area .user-info .user-name { font-size: 12px; font-weight: 600; color: #1e1b4b; }
        .sidebar .user-area .user-info .user-email { font-size: 10px; color: #6b7280; }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }
        @media (min-width: 769px) { .sidebar-overlay { display: none !important; } }
        .main-content {
            margin-left: 0;
            padding: 16px;
            flex: 1;
            min-height: 100vh;
            width: 100%;
            transition: margin-left 0.3s ease;
        }
        @media (min-width: 769px) {
            .main-content { margin-left: 240px; padding: 24px; width: calc(100% - 240px); }
        }
        .container { max-width: 900px; margin: 0 auto; }

            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 10px 10px 28px rgba(0,0,0,0.05), -10px -10px 28px rgba(255,255,255,0.6),

        }

        .clay-md { padding: 14px 16px; border-radius: 20px; }
        .dashboard-header {

            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .dashboard-header .titulo {

            align-items: center;
            gap: 10px;
        }

        .dashboard-header .titulo p { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .hamburger {

            align-items: center;
            gap: 12px;

            color: #6b7280;

        }

            box-shadow: 0 0 8px rgba(52,211,153,0.4);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

            font-size: 16px;
            color: #1e1b4b;
            font-weight: 700;
        }
        .top-bar .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-nuevo {
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            box-shadow: 0 3px 10px rgba(124,58,237,0.3);

            align-items: center;

        .btn-nuevo i { font-size: 12px; }
        
        .btn-gasto-directo {
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 3px 10px rgba(220,38,38,0.3);
            display: flex;
            align-items: center;
            gap: 4px;

        .btn-gasto-directo:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(220,38,38,0.4); }
        .btn-gasto-directo i { font-size: 12px; }
        
        .filtros {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }
        .filtros input, .filtros select {
            padding: 6px 10px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 16px;
            font-size: 11px;
            color: #1a1a2e;
            outline: none;
            box-shadow: inset 3px 3px 10px rgba(0,0,0,0.02), inset -3px -3px 10px rgba(255,255,255,0.4);
            transition: all 0.25s ease;
            box-sizing: border-box;
            width: 100%;
        }
        .filtros input:focus, .filtros select:focus {
            border-color: #a78bfa;
            background: rgba(255,255,255,0.85);
            box-shadow: 0 0 0 3px rgba(167,139,250,0.1), inset 3px 3px 10px rgba(0,0,0,0.02);
        }
        .filtros input::placeholder { color: #a0a0b8; font-size: 10px; }
        #gastosList {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        #gastosList::-webkit-scrollbar { width: 4px; }
        #gastosList::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); border-radius: 10px; }
        #gastosList::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #c4b5fd, #a78bfa); border-radius: 10px; }
        .gasto-item {
            padding: 10px 14px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: inset 2px 2px 4px rgba(255,255,255,0.6), inset -2px -2px 4px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .gasto-item:hover { background: rgba(255,255,255,0.8); transform: scale(1.01); border-color: rgba(167,139,250,0.3); }
        .gasto-item:active { transform: scale(0.98); }
        .gasto-item:last-child { margin-bottom: 0; }
        .gasto-item .gasto-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .gasto-item .gasto-header .info h4 { font-size: 13px; color: #1e1b4b; font-weight: 600; }
        .gasto-item .gasto-header .info .meta { font-size: 10px; color: #6b7280; margin-top: 1px; }
        .gasto-item .gasto-header .info .meta .tipo-directo {
            background: rgba(220,38,38,0.1);
            color: #dc2626;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .gasto-item .gasto-header .monto {
            font-size: 15px;
            font-weight: 700;
            color: #dc2626;
            text-align: right;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .gasto-item .gasto-header .monto .per { font-size: 9px; color: #6b7280; font-weight: 400; }
        .gasto-item .gasto-nota {
            font-size: 10px;
            color: #92400e;
            background: rgba(252,211,77,0.15);
            padding: 4px 10px;
            border-radius: 10px;
            margin-top: 4px;
            display: inline-block;
        }
        .gasto-item .gasto-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .btn-sm {
            border: none;
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 9px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .btn-sm i { font-size: 10px; }
        .btn-sm:hover { transform: scale(1.08); }
        .btn-editar { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-eliminar { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-volver {
            border: none;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #6b7280, #4b5563);
            box-shadow: 0 2px 8px rgba(107,114,128,0.3);
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-volver:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(107,114,128,0.4); }
        .btn-volver i { font-size: 12px; }
        .footer {
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            margin-top: 20px;
            padding: 8px 0;
        }
        .footer .brand { color: #a78bfa; font-weight: 600; font-size: 11px; }
        .empty-message {
            text-align: center;
            padding: 30px 16px;
            color: #6b7280;
            font-size: 13px;
        }
        .empty-message i { font-size: 32px; color: #c4b5fd; display: block; margin: 0 auto 10px; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
            animation: modalFadeIn 0.25s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px 16px 16px;
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 16px 48px rgba(0,0,0,0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content::-webkit-scrollbar { width: 4px; }
        .modal-content::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #c4b5fd, #a78bfa); border-radius: 10px; }
        .modal-icono {

            height: 44px;
            border-radius: 50%;

        .modal-subtitulo { text-align: center; font-size: 12px; color: #6b7280; margin-bottom: 14px; }
        .modal-grupo { margin-bottom: 12px; }

        .modal-grupo label .obligatorio { color: #ef4444; }
        .modal-grupo input, .modal-grupo select, .modal-grupo textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            font-size: 14px;
            color: #1a1a2e;
            outline: none;
            box-shadow: inset 3px 3px 10px rgba(0,0,0,0.02), inset -3px -3px 10px rgba(255,255,255,0.4);

        }
        .modal-grupo input::placeholder, .modal-grupo textarea::placeholder { color: #a0a0b8; font-size: 13px; }
        .modal-grupo select {

        }

        .modal-detalle .detalle-acciones .btn-cerrar-detalle {

    <script src="js/storage.js"></script>
    <script>
        function abrirSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        function cerrarSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        document.addEventListener('click', function(e) {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && e.target !== overlay && !e.target.closest('.hamburger')) {
                    cerrarSidebar();
                }
            }
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                cerrarSidebar();
            }
        });

        function logout() {
            if (confirm('¿Cerrar sesión?')) {
                localStorage.removeItem('user_session');
                window.location.href = 'login.html';
            }
        }

        // ============================================
        // DATOS
        // ============================================
        function getGastos() {
            const data = localStorage.getItem('gastos');
            return data ? JSON.parse(data) : [];
        }

        function getGastosDirectos() {
            const data = localStorage.getItem('gastosDirectos');
            return data ? JSON.parse(data) : [];
        }

        function getGrupos() {
            const data = localStorage.getItem('grupos');
            return data ? JSON.parse(data) : [];
        }

        function getAlumnos() {
            const data = localStorage.getItem('alumnos');
            return data ? JSON.parse(data) : [];
        }

        function guardarGastos(gastos) {
            localStorage.setItem('gastos', JSON.stringify(gastos));
        }

        function guardarGastosDirectos(gastos) {
            localStorage.setItem('gastosDirectos', JSON.stringify(gastos));
            // Notificar al dashboard que los gastos directos cambiaron
            localStorage.setItem('gastosDirectosActualizado', Date.now().toString());
        }

        function guardarAlumnos(alumnos) {
            localStorage.setItem('alumnos', JSON.stringify(alumnos));
        }

        // Variables globales
        var todosLosGastos = getGastos();
        var gastosDirectos = getGastosDirectos();
        var grupos = getGrupos();
        var alumnos = getAlumnos();
        var nextId = todosLosGastos.length > 0 ? Math.max(...todosLosGastos.map(function(g) { return g.id; })) + 1 : 1;
        var nextIdDirecto = gastosDirectos.length > 0 ? Math.max(...gastosDirectos.map(function(g) { return g.id; })) + 1 : 1;

        // ============================================
        // INICIALIZAR
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            cargarFiltrosGrupos();
            renderizarGastos();
        });

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            cargarFiltrosGrupos();
            renderizarGastos();
        }

        // ============================================
        // FUNCIONES
        // ============================================
        function cargarFiltrosGrupos() {
            var select = document.getElementById('filterGrupo');
            while (select.options.length > 1) {
                select.remove(1);
            }

            grupos.forEach(function(grupo) {
                var option = document.createElement('option');
                option.value = grupo.id;
                option.textContent = grupo.nombre;
                select.appendChild(option);
            });
        }

        function getNombreGrupo(id) {
            var grupo = grupos.find(function(g) { return g.id === id; });
            return grupo ? grupo.nombre : 'Grupo ' + id;
        }

        function getAlumnosDelGrupo(grupoId) {
            return alumnos.filter(function(a) { return a.grupoId === grupoId; });
        }

        function renderizarGastos() {
            var container = document.getElementById('gastosList');
            var search = document.getElementById('searchGasto').value.toLowerCase().trim();
            var filterGrupo = document.getElementById('filterGrupo').value;

            // Unir gastos compartidos + gastos directos
            var todos = [];

            // Gastos compartidos
            todosLosGastos.forEach(function(g) {
                todos.push({
                    ...g,
                    tipoGasto: 'compartido'
                });
            });

            // Gastos directos
            gastosDirectos.forEach(function(g) {
                todos.push({
                    ...g,
                    tipoGasto: 'directo',
                    grupoId: null,
                    participantes: 1,
                    excluidos: []
                });
            });

            var filtrados = todos;

            if (filterGrupo) {
                filtrados = filtrados.filter(function(g) {
                    return g.tipoGasto === 'directo' || g.grupoId == filterGrupo;
                });
            }

            if (search) {
                filtrados = filtrados.filter(function(g) {
                    return g.descripcion.toLowerCase().includes(search) ||
                        g.monto.toString().includes(search) ||
                        g.tipo.toLowerCase().includes(search);
                });
            }

            filtrados.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); });

            if (filtrados.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-credit-card"></i>
                        No hay gastos registrados
                        <br><br>
                        <button class="btn-nuevo" onclick="mostrarModalCrear()" style="margin:0 auto;">
                            <i class="fas fa-plus"></i>
                            Registrar primer gasto
                        </button>
                    </div>
                `;
                actualizarTotalDirectos();
                return;
            }

            var html = '';
            filtrados.forEach(function(gasto) {
                var esDirecto = gasto.tipoGasto === 'directo';
                var grupoNombre = esDirecto ? 'Gasto Directo' : getNombreGrupo(gasto.grupoId);
                var porNiño = esDirecto ? '' : (gasto.monto / gasto.participantes).toFixed(2);
                var montoDisplay = esDirecto ? '' : '$${porNiño} c/u • ${gasto.participantes} niños';
                var tipoBadge = esDirecto ? '<span class="tipo-directo">DIRECTO</span>' : gasto.tipo;
                var excluidos = gasto.excluidos || [];
                var nota = gasto.nota || '';

                html += `
                    <div class="gasto-item" data-id="${gasto.id}" onclick="verDetalleGasto(${gasto.id}, '${esDirecto ? 'directo' : 'compartido'}')">
                        <div class="gasto-header">
                            <div class="info">
                                <h4>${gasto.descripcion} ${esDirecto ? '<span style="color:#dc2626;font-size:10px;">⬇️ Directo</span>' : ''}</h4>
                                <div class="meta">${grupoNombre} • ${tipoBadge} • 📅 ${gasto.fecha}</div>
                            </div>
                            <div class="monto">
                                -$${gasto.monto.toLocaleString()}
                                ${!esDirecto ? '<div class="per">$${porNiño} c/u • ' + gasto.participantes + ' niños</div>' : ''}
                            </div>
                        </div>
                        ${excluidos.length > 0 ? '<div class="gasto-nota"><i class="fas fa-exclamation-triangle" style="color:#dc2626;"></i> ⚠️ ' + excluidos.length + ' alumno(s) excluido(s)</div>' : ''}
                        ${nota && !nota.includes('AJUSTE AUTOMÁTICO') ? '<div class="gasto-nota"><i class="fas fa-pen"></i> ' + nota + '</div>' : ''}
                        <div class="gasto-actions" onclick="event.stopPropagation();">
                            <button class="btn-sm btn-editar" onclick="${esDirecto ? 'mostrarModalEditarDirecto' : 'mostrarModalEditar'}(${gasto.id})">
                                <i class="fas fa-pencil-alt"></i>
                            </button>
                            <button class="btn-sm btn-eliminar" onclick="${esDirecto ? 'eliminarGastoDirecto' : 'eliminarGasto'}(${gasto.id})">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            actualizarTotalDirectos();
        }

        function actualizarTotalDirectos() {
            var total = gastosDirectos.reduce(function(sum, g) { return sum + g.monto; }, 0);
            document.getElementById('totalDirectos').textContent = '$' + total.toFixed(2);
        }

        function filtrarGastos() {
            renderizarGastos();
        }

        // ============================================
        // DETALLE DE GASTO (compartido o directo)
        // ============================================
        function verDetalleGasto(id, tipo) {
            var gasto;
            if (tipo === 'directo') {
                gasto = gastosDirectos.find(function(g) { return g.id === id; });
            } else {
                gasto = todosLosGastos.find(function(g) { return g.id === id; });
            }
            if (!gasto) return;

            var grupoNombre = tipo === 'directo' ? 'Gasto Directo' : getNombreGrupo(gasto.grupoId);
            var porNiño = tipo === 'directo' ? '' : (gasto.monto / gasto.participantes).toFixed(2);
            var excluidos = gasto.excluidos || [];
            var nota = gasto.nota || '';

            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay modal-detalle';
            overlay.id = 'modalDetalleOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono" style="background:linear-gradient(135deg,#3b82f6,#2563eb);">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <div class="modal-titulo">${gasto.descripcion}</div>
                    <div class="modal-subtitulo">${tipo === 'directo' ? 'Gasto Directo' : 'Detalle del gasto'}</div>

                    <div class="detalle-item">
                        <span class="etiqueta">📅 Fecha</span>
                        <span class="valor">${gasto.fecha}</span>
                    </div>
                    <div class="detalle-item">
                        <span class="etiqueta">📂 ${tipo === 'directo' ? 'Tipo' : 'Grupo'}</span>
                        <span class="valor">${grupoNombre}</span>
                    </div>
                    ${tipo !== 'directo' ? `
                    <div class="detalle-item">
                        <span class="etiqueta">🏷️ Tipo</span>
                        <span class="valor">${gasto.tipo}</span>
                    </div>
                    ` : ''}
                    <div class="detalle-item">
                        <span class="etiqueta">💰 Monto total</span>
                        <span class="valor rojo">-$${gasto.monto.toLocaleString()}</span>
                    </div>
                    ${tipo !== 'directo' ? `
                    <div class="detalle-item">
                        <span class="etiqueta">👨‍🎓 Participantes</span>
                        <span class="valor">${gasto.participantes} niños</span>
                    </div>
                    <div class="detalle-item">
                        <span class="etiqueta">💵 Por niño</span>
                        <span class="valor">$${porNiño}</span>
                    </div>
                    ` : ''}
                    ${excluidos.length > 0 ? `
                        <div class="detalle-excluidos">
                            <i class="fas fa-exclamation-triangle"></i>
                            <strong>Alumnos excluidos:</strong> ${excluidos.join(', ')}
                        </div>
                    ` : ''}
                    ${nota ? `
                        <div class="detalle-nota">
                            <i class="fas fa-pen"></i>
                            <strong>Nota:</strong> ${nota}
                        </div>
                    ` : ''}

                    <div class="detalle-acciones">
                        <button class="btn btn-editar-detalle" onclick="cerrarModalDetalle();${tipo === 'directo' ? 'mostrarModalEditarDirecto' : 'mostrarModalEditar'}(${gasto.id})">
                            <i class="fas fa-pencil-alt"></i>
                            Editar
                        </button>
                        <button class="btn btn-eliminar-detalle" onclick="cerrarModalDetalle();${tipo === 'directo' ? 'eliminarGastoDirecto' : 'eliminarGasto'}(${gasto.id})">
                            <i class="fas fa-trash-alt"></i>
                            Eliminar
                        </button>
                        <button class="btn btn-cerrar-detalle" onclick="cerrarModalDetalle()">
                            <i class="fas fa-times"></i>
                            Cerrar
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function cerrarModalDetalle() {
            var modal = document.getElementById('modalDetalleOverlay');
            if (modal) modal.remove();
        }

        // ============================================
        // MODAL GASTO DIRECTO
        // ============================================
        function mostrarModalGastoDirecto() {
            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono gasto-directo-icono">
                        <i class="fas fa-minus-circle"></i>
                    </div>
                    <div class="modal-titulo">Gasto Directo</div>
                    <div class="modal-subtitulo">Registra un gasto que se descuenta del Disponible Total</div>
                    <form id="formGastoDirectoModal">
                        <div class="modal-grupo">
                            <label>Fecha <span class="obligatorio">*</span></label>
                            <input type="date" id="fechaGastoDirectoInput" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Descripción <span class="obligatorio">*</span></label>
                            <input type="text" id="descripcionGastoDirectoInput" placeholder="Ej: Compra de material" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Monto <span class="obligatorio">*</span></label>
                            <input type="number" id="montoGastoDirectoInput" placeholder="Ej: 500" required>
                        </div>
                        <div class="modal-grupo">
                            <div class="modal-info" style="background:rgba(220,38,38,0.08);border-left:3px solid #dc2626;">
                                <span class="rojo">⚠️ Este gasto se descontará del Disponible Total en el Dashboard.</span>
                            </div>
                        </div>
                        <div class="modal-acciones">
                            <button type="submit" class="btn btn-guardar-directo">
                                <i class="fas fa-check"></i>
                                Registrar Gasto
                            </button>
                            <button type="button" class="btn btn-cancelar" onclick="cerrarModal()">
                                <i class="fas fa-times"></i>
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);

            var fechaInput = document.getElementById('fechaGastoDirectoInput');
            if (fechaInput) {
                fechaInput.value = new Date().toISOString().split('T')[0];
            }

            setTimeout(function() {
                var input = document.getElementById('descripcionGastoDirectoInput');
                if (input) input.focus();
            }, 100);

            document.getElementById('formGastoDirectoModal').addEventListener('submit', function(e) {
                e.preventDefault();

                var fecha = document.getElementById('fechaGastoDirectoInput').value;
                var descripcion = document.getElementById('descripcionGastoDirectoInput').value.trim();
                var monto = parseFloat(document.getElementById('montoGastoDirectoInput').value);

                if (!fecha || !descripcion || !monto || monto <= 0) {
                    alert('⚠️ Completa todos los campos correctamente');
                    return;
                }

                // Crear gasto directo
                var nuevoGasto = {
                    id: nextIdDirecto++,
                    fecha: fecha,
                    descripcion: descripcion,
                    tipo: 'Directo',
                    monto: monto,
                    participantes: 1,
                    nota: '',
                    excluidos: []
                };

                gastosDirectos.push(nuevoGasto);
                guardarGastosDirectos(gastosDirectos);
                renderizarGastos();
                cerrarModal();
                alert('✅ Gasto directo registrado correctamente. Se descontará del Disponible Total.');
            });
        }

        // ============================================
        // ELIMINAR GASTO DIRECTO
        // ============================================
        function eliminarGastoDirecto(id) {

        // ============================================
        // GASTO COMPARTIDO - CREAR
        // ============================================
        function mostrarModalCrear() {
            if (grupos.length === 0) {
                alert('⚠️ Primero debes crear un grupo');
                return;
            }

            var grupoOptions = '';
            grupos.forEach(function(g) {
                grupoOptions += '<option value="' + g.id + '">' + g.nombre + '</option>';
            });

            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono" style="background:linear-gradient(135deg,#ec4899,#db2777);">
                        <i class="fas fa-credit-card"></i>
                    </div>
                    <div class="modal-titulo">Nuevo Gasto Compartido</div>
                    <div class="modal-subtitulo">Registra un gasto compartido entre alumnos</div>
                    <form id="formGastoModal">
                        <div class="modal-grupo">
                            <label>Grupo <span class="obligatorio">*</span></label>
                            <select id="grupoGastoInput" required>
                                ${grupoOptions}
                            </select>
                        </div>
                        <div class="modal-grupo">
                            <label>Fecha</label>
                            <input type="date" id="fechaGastoInput">
                        </div>
                        <div class="modal-grupo">
                            <label>Descripción del gasto <span class="obligatorio">*</span></label>
                            <input type="text" id="descripcionGastoInput" placeholder="Ej: Material didáctico" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Tipo de gasto <span class="obligatorio">*</span></label>
                            <select id="tipoGastoInput" required>
                                <option value="Escolar">Escolar</option>
                                <option value="Mantenimiento">Mantenimiento</option>
                                <option value="Convivio">Convivio</option>
                                <option value="Limpieza">Limpieza</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="modal-grupo">
                            <label>Cantidad total <span class="obligatorio">*</span></label>
                            <input type="number" id="montoGastoInput" placeholder="Ej: 500" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Nota (opcional)</label>
                            <textarea id="notaGastoInput" placeholder="Observaciones adicionales..."></textarea>
                        </div>
                        <div class="modal-grupo">
                            <div class="explicacion-descuento">
                                <i class="fas fa-info-circle"></i>
                                <strong>¿Cómo funciona?</strong> El gasto se divide entre los niños del grupo.
                                A cada niño se le descuenta su parte de su <strong>Disponible</strong>.
                                Si un niño no tiene suficiente, se excluye y se reajusta el gasto.
                            </div>
                        </div>
                        <div class="modal-grupo" id="infoSaldos" style="display:none;">
                            <div class="modal-info" id="infoSaldosContent"></div>
                        </div>
                        <div class="modal-acciones">
                            <button type="submit" class="btn btn-guardar">
                                <i class="fas fa-check"></i>
                                Guardar Gasto
                            </button>
                            <button type="button" class="btn btn-cancelar" onclick="cerrarModal()">
                                <i class="fas fa-times"></i>
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);

            var fechaInput = document.getElementById('fechaGastoInput');
            if (fechaInput) {
                fechaInput.value = new Date().toISOString().split('T')[0];
            }

            var montoInput = document.getElementById('montoGastoInput');
            var grupoSelect = document.getElementById('grupoGastoInput');

            function calcularSaldos() {
                var grupoId = parseInt(grupoSelect.value);
                var monto = parseFloat(montoInput.value);
                var infoDiv = document.getElementById('infoSaldos');
                var infoContent = document.getElementById('infoSaldosContent');

                if (!grupoId || !monto || monto <= 0) {
                    infoDiv.style.display = 'none';
                    return;
                }

                var alumnosGrupo = getAlumnosDelGrupo(grupoId);

                if (alumnosGrupo.length === 0) {
                    infoDiv.style.display = 'block';
                    infoContent.innerHTML = '⚠️ No hay alumnos registrados en este grupo. Agrega alumnos primero.';
                    infoContent.className = 'modal-info naranja';
                    return;
                }

                var montoPorNino = monto / alumnosGrupo.length;

                var sinSaldo = alumnosGrupo.filter(function(a) {
                    var disponible = a.disponible || 0;
                    return disponible < montoPorNino;
                });

                if (sinSaldo.length > 0) {
                    var detalles = sinSaldo.map(function(a) {
                        var disponible = a.disponible || 0;
                        var falta = (montoPorNino - disponible).toFixed(2);
                        return a.nombre + ' (Disponible: $' + disponible.toFixed(2) + ', falta: $' + falta + ')';
                    }).join('\n');

                    infoDiv.style.display = 'block';
                    infoContent.innerHTML = '❌ Los siguientes alumnos NO tienen suficiente disponible:\n\n' + detalles + '\n\n💰 Monto por niño: $' + montoPorNino.toFixed(2) + '\n⚠️ Se reajustará el gasto excluyendo a estos alumnos.';
                    infoContent.className = 'modal-info rojo';
                } else {
                    infoDiv.style.display = 'block';
                    infoContent.innerHTML = '✅ ' + alumnosGrupo.length + ' niños participarán\n💰 $' + montoPorNino.toFixed(2) + ' por niño (se descuenta de su Disponible)';
                    infoContent.className = 'modal-info verde';
                }
            }

            montoInput.addEventListener('input', calcularSaldos);
            grupoSelect.addEventListener('change', calcularSaldos);

            setTimeout(function() {
                var input = document.getElementById('montoGastoInput');
                if (input) input.focus();
            }, 100);

            document.getElementById('formGastoModal').addEventListener('submit', function(e) {
                e.preventDefault();

                var grupoId = parseInt(document.getElementById('grupoGastoInput').value);
                var fecha = document.getElementById('fechaGastoInput').value || new Date().toISOString().split('T')[0];
                var descripcion = document.getElementById('descripcionGastoInput').value.trim();
                var tipo = document.getElementById('tipoGastoInput').value;
                var monto = parseFloat(document.getElementById('montoGastoInput').value);
                var notaManual = document.getElementById('notaGastoInput').value.trim();

                if (!grupoId || !monto || monto <= 0 || !descripcion) {
                    alert('⚠️ Completa todos los campos obligatorios');
                    return;
                }

                var alumnosGrupo = getAlumnosDelGrupo(grupoId);

                if (alumnosGrupo.length === 0) {
                    alert('⚠️ No hay alumnos en este grupo');
                    return;
                }

                var montoPorNinoOriginal = monto / alumnosGrupo.length;

                var sinSaldo = alumnosGrupo.filter(function(a) {
                    var disponible = a.disponible || 0;
                    return disponible < montoPorNinoOriginal;
                });

                var participantes = alumnosGrupo;
                var montoPorNino = montoPorNinoOriginal;
                var montoTotal = monto;
                var notaFinal = notaManual || '';
                var excluidos = [];

                if (sinSaldo.length > 0) {
                    var nombresExcluidos = sinSaldo.map(function(a) { return a.nombre; }).join(', ');

                    var mensaje = '❌ Los siguientes alumnos NO tienen suficiente Disponible:\n\n' + sinSaldo.map(function(a) {
                        var disponible = a.disponible || 0;
                        return a.nombre + ' (Disponible: $' + disponible.toFixed(2) + ', necesita: $' + montoPorNinoOriginal.toFixed(2) + ')';
                    }).join('\n') + '\n\nSe reajustará el gasto excluyendo a estos alumnos.';

                    var reajustar = confirm(mensaje + '\n\n¿Deseas reajustar el gasto excluyendo a los que no alcanzan?');

                    if (!reajustar) {
                        return;
                    }

                    var sinSaldoIds = sinSaldo.map(function(a) { return a.id; });
                    participantes = alumnosGrupo.filter(function(a) { return !sinSaldoIds.includes(a.id); });

                    if (participantes.length === 0) {
                        alert('❌ No hay alumnos con suficiente Disponible para cubrir este gasto');
                        return;
                    }

                    montoPorNino = monto / participantes.length;
                    montoTotal = montoPorNino * participantes.length;
                    excluidos = sinSaldo.map(function(a) { return a.nombre; });

                    var confirmar2 = confirm(
                        '🔄 REAJUSTE PROPUESTO:\n\n' +
                        'Total original: $' + monto.toFixed(2) + '\n' +
                        'Niños que participan: ' + participantes.length + '\n' +
                        'Nuevo monto por niño: $' + montoPorNino.toFixed(2) + '\n' +
                        'Nuevo total: $' + montoTotal.toFixed(2) + '\n\n' +
                        '🚫 Excluidos: ' + nombresExcluidos + '\n\n' +
                        '⚠️ ¿Confirmas este ajuste?'
                    );

                    if (!confirmar2) {
                        return;
                    }

                    var notaAutomatica = '⚠️ AJUSTE AUTOMÁTICO: ' + sinSaldo.length + ' alumno(s) excluido(s) por falta de Disponible: ' + nombresExcluidos + '. Se reajustó el gasto a $' + montoPorNino.toFixed(2) + ' por niño (' + participantes.length + ' niños participaron). Total ajustado: $' + montoTotal.toFixed(2) + '. Informar a los padres/tutores de los alumnos excluidos para cubrir el monto faltante.';
                    notaFinal = notaManual ? notaManual + ' | ' + notaAutomatica : notaAutomatica;
                }

                var nuevoGasto = {
                    id: nextId++,
                    grupoId: grupoId,
                    fecha: fecha,
                    descripcion: descripcion,
                    tipo: tipo,
                    monto: montoTotal,
                    participantes: participantes.length,
                    nota: notaFinal,
                    excluidos: excluidos
                };

                var result = crearGasto(nuevoGasto);
                if (result.success) {
                    // Actualizar disponible de los alumnos que participaron
                    participantes.forEach(function(a) {
                        var alumno = alumnos.find(function(al) { return al.id === a.id; });
                        if (alumno) {
                            alumno.disponible = Math.max(0, (alumno.disponible || 0) - montoPorNino);
                            actualizarAlumno(alumno);
                        }
                    });

                    todosLosGastos = getGastos();
                    alumnos = getAlumnos();
                    renderizarGastos();
                    cerrarModal();

                    var mensajeFinal = '✅ Gasto registrado exitosamente\n\nTotal: $' + montoTotal.toFixed(2) + '\nParticipan: ' + participantes.length + ' niños\n$' + montoPorNino.toFixed(2) + ' por niño';
                    if (excluidos.length > 0) {
                        mensajeFinal += '\n\n🚫 Excluidos: ' + excluidos.join(', ') + '\n📝 Se generó nota automática en el registro.';
                    }
                    alert(mensajeFinal);
                } else {
                    alert('❌ Error al registrar gasto: ' + result.error);
                }
            });
        }

        // ============================================
        // GASTO COMPARTIDO - EDITAR
        // ============================================
        function mostrarModalEditar(id) {
            cerrarModalDetalle();

            var gasto = todosLosGastos.find(function(g) { return g.id === id; });

            var grupoOptions = '';

                var selected = g.id === gasto.grupoId ? 'selected' : '';
                grupoOptions += '<option value="' + g.id + '" ' + selected + '>' + g.nombre + '</option>';
            });

            var overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modalOverlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icono" style="background:linear-gradient(135deg,#f59e0b,#d97706);">
                        <i class="fas fa-pencil-alt"></i>
                    </div>
                    <div class="modal-titulo">Editar Gasto Compartido</div>
                    <div class="modal-subtitulo">Actualiza los datos del gasto</div>
                    <form id="formGastoModal">
                        <div class="modal-grupo">
                            <label>Grupo <span class="obligatorio">*</span></label>
                            <select id="grupoGastoInput" required>
                                ${grupoOptions}
                            </select>
                        </div>
                        <div class="modal-grupo">
                            <label>Fecha</label>
                            <input type="date" id="fechaGastoInput" value="${gasto.fecha}">
                        </div>
                        <div class="modal-grupo">
                            <label>Descripción del gasto <span class="obligatorio">*</span></label>
                            <input type="text" id="descripcionGastoInput" value="${gasto.descripcion}" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Tipo de gasto <span class="obligatorio">*</span></label>
                            <select id="tipoGastoInput" required>
                                <option value="Escolar" ${gasto.tipo === 'Escolar' ? 'selected' : ''}>Escolar</option>
                                <option value="Mantenimiento" ${gasto.tipo === 'Mantenimiento' ? 'selected' : ''}>Mantenimiento</option>
                                <option value="Convivio" ${gasto.tipo === 'Convivio' ? 'selected' : ''}>Convivio</option>
                                <option value="Limpieza" ${gasto.tipo === 'Limpieza' ? 'selected' : ''}>Limpieza</option>
                                <option value="Otro" ${gasto.tipo === 'Otro' ? 'selected' : ''}>Otro</option>
                            </select>
                        </div>
                        <div class="modal-grupo">
                            <label>Cantidad total <span class="obligatorio">*</span></label>
                            <input type="number" id="montoGastoInput" value="${gasto.monto}" required>
                        </div>
                        <div class="modal-grupo">
                            <label>Nota</label>
                            <textarea id="notaGastoInput">${gasto.nota || ''}</textarea>
                        </div>
                        <div class="modal-acciones">
                            <button type="submit" class="btn btn-editar-modal">
                                <i class="fas fa-check"></i>
                                Actualizar
                            </button>
                            <button type="button" class="btn btn-cancelar" onclick="cerrarModal()">
                                <i class="fas fa-times"></i>
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(overlay);

            setTimeout(function() {
                var input = document.getElementById('montoGastoInput');
                if (input) input.focus();
            }, 100);

            document.getElementById('formGastoModal').addEventListener('submit', function(e) {
                e.preventDefault();

                var grupoId = parseInt(document.getElementById('grupoGastoInput').value);
                var fecha = document.getElementById('fechaGastoInput').value || new Date().toISOString().split('T')[0];
                var descripcion = document.getElementById('descripcionGastoInput').value.trim();
                var tipo = document.getElementById('tipoGastoInput').value;
                var monto = parseFloat(document.getElementById('montoGastoInput').value);
                var nota = document.getElementById('notaGastoInput').value.trim();

                if (!grupoId || !monto || monto <= 0 || !descripcion) {
                    alert('⚠️ Completa todos los campos obligatorios');
                    return;
                }

                gasto.grupoId = grupoId;
                gasto.fecha = fecha;
                gasto.descripcion = descripcion;
                gasto.tipo = tipo;
                gasto.monto = monto;
                if (nota) gasto.nota = nota;

                var result = actualizarGasto(gasto);
                if (result.success) {
                    todosLosGastos = getGastos();
                    renderizarGastos();
                    cerrarModal();
                    alert('✅ Gasto actualizado');
                } else {
                    alert('❌ Error al actualizar gasto: ' + result.error);
                }
            });
        }

        // ============================================
        // GASTO COMPARTIDO - ELIMINAR
        // ============================================
        function eliminarGasto(id) {
            var gasto = todosLosGastos.find(function(g) { return g.id === id; });
            if (!gasto) return;

            cerrarModalDetalle();

            if (confirm('⚠️ ¿Eliminar el gasto "' + gasto.descripcion + '" por $' + gasto.monto.toFixed(2) + '?')) {
                var result = eliminarGasto(id);
                if (result.success) {
                    todosLosGastos = getGastos();
                    renderizarGastos();
                    alert('✅ Gasto eliminado');
                } else {
                    alert('❌ Error al eliminar gasto: ' + result.error);
                }
            }
        }

        // ============================================
        // CERRAR MODAL
        // ============================================
        function cerrarModal() {
            var modal = document.getElementById('modalOverlay');
            if (modal) modal.remove();
        }

        document.addEventListener('click', function(e) {
            var modal = document.getElementById('modalOverlay');
            if (modal && e.target === modal) {
                cerrarModal();
            }
            var modalDetalle = document.getElementById('modalDetalleOverlay');
            if (modalDetalle && e.target === modalDetalle) {
                cerrarModalDetalle();
            }
        });

        // ============================================
        // EXPONER FUNCIONES
        // ============================================
        window.abrirSidebar = abrirSidebar;
        window.cerrarSidebar = cerrarSidebar;
        window.logout = logout;
        window.mostrarModalCrear = mostrarModalCrear;
        window.mostrarModalGastoDirecto = mostrarModalGastoDirecto;
        window.mostrarModalEditar = mostrarModalEditar;
        window.mostrarModalEditarDirecto = mostrarModalEditarDirecto;
        window.eliminarGasto = eliminarGasto;
        window.eliminarGastoDirecto = eliminarGastoDirecto;
        window.cerrarModal = cerrarModal;
        window.verDetalleGasto = verDetalleGasto;
        window.filtrarGastos = filtrarGastos;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('[Service Worker] Registrado correctamente');
                    })
                    .catch(function(error) {
                        console.log('[Service Worker] Error al registrar:', error);
                    });
            });
        }
    </script>
